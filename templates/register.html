<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartSpend AI</title>

    <link rel="icon" type="image/png" href="/static/icon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="landing-container">

    <h2 class="text-center mb-4" style="color: white;">
        <img src="/static/icon.png" width="30" height="30">
        SmartSpend AI
    </h2>

    <button id="theme-toggle">🌙</button>

    <p class="subtitle">
        Create an Account
    </p>

    <p class="description">
        Start tracking your expenses with AI-powered insights.
    </p>

    <div class="landing-buttons">

        <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Username">

        <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Email">

        <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Password">

        <button onclick="register()">
            Register
        </button>

        <p class="or-text">
            Already have an account?
        </p>

        <button onclick="location.href='/login-page'">
            Login
        </button>

        <button onclick="location.href='/'">
            ← Back
        </button>

    </div>

</div>

<script>

async function register() {

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !email || !password) {
        alert("Please fill all fields.");
        return;
    }

    const response = await fetch("/register", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        credentials: "same-origin",

        body: JSON.stringify({
            username,
            email,
            password
        })

    });

    const data = await response.json();

    if (response.ok) {

        alert(data.message);

        window.location.href = "/login-page";

    } else {

        alert(data.message);

    }

}

</script>

<script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>
</html>
